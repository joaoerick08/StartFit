spring.application.name=fitstart

# Banco de dados (valores padrão para desenvolvimento local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fitstart}
spring.datasource.username=${DB_USER:fitstart}
spring.datasource.password=${DB_PASSWORD:fitstart}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Criação das tabelas e carga dos exercícios na inicialização (scripts idempotentes)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/01_schema.sql
spring.sql.init.data-locations=classpath:db/02_exercicios.sql

# Segurança
app.jwt-secret=${JWT_SECRET:troque-esta-chave-em-producao-troque-esta-chave}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
